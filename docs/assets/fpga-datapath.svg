<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="850" viewBox="0 0 1440 850" role="img" aria-labelledby="title description">
<title id="title">PlutoSDR FPGA target processing</title>
<desc id="description">The received IQ signal feeds four parallel paths. Each path adds a delay and Doppler shift, then scales the echo amplitude. The enabled echoes are added together and sent to the transmitter. Pipeline registers are omitted for clarity.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#a1adb2"/></marker></defs>
<style>text{font-family:Carlito,"Segoe UI",Arial,sans-serif;fill:#dee2e6;font-size:21px}.muted{fill:#a1adb2;font-size:18px}.title{font-size:32px;font-weight:600}.green{fill:#37c964}.box{fill:#182126;stroke:#394348;stroke-width:1.5}.path{fill:none;stroke:#a1adb2;stroke-width:2}.control{fill:none;stroke:#37c964;stroke-width:1.5;stroke-dasharray:5 5}.label{font-size:18px;font-weight:600}.coefficient{font-size:17px;fill:#a1adb2}</style>
<rect width="1440" height="850" rx="16" fill="#11191e"/>
<rect x="36" y="36" width="6" height="40" rx="3" fill="#37c964"/>
<text class="title" x="58" y="65">Four targets in the FPGA</text>
<text class="muted" x="58" y="96">Each target adds delay and a Doppler shift to the received signal.</text>
<rect class="box" x="1060" y="30" width="344" height="78" rx="8"/>
<text x="1232" y="60" text-anchor="middle">Target settings (AXI)</text>
<text class="muted" x="1232" y="88" text-anchor="middle">Delay, Doppler, gain and enable</text>
<rect class="box" x="34" y="400" width="160" height="88" rx="8"/>
<text x="114" y="435" text-anchor="middle">Receive IQ</text><text class="muted" x="114" y="465" text-anchor="middle">AD9363 → FPGA</text>
<path class="path" d="M194 444 H238 M238 228 V678"/>
<rect class="box" x="1095" y="400" width="155" height="88" rx="8"/>
<text x="1172" y="435" text-anchor="middle">Sum</text><text class="muted" x="1172" y="465" text-anchor="middle">16-bit saturation</text>
<path class="path" d="M1045 228 V678 M1045 444 H1095" marker-end="url(#arrow)"/>
<path class="path" d="M1250 444 H1280" marker-end="url(#arrow)"/>
<rect class="box" x="1280" y="400" width="125" height="88" rx="8"/>
<text x="1342" y="435" text-anchor="middle">Transmit IQ</text><text class="muted" x="1342" y="465" text-anchor="middle">→ AD9363</text>

<g aria-label="Target 1">
<rect x="272" y="150" width="740" height="128" rx="10" fill="#142021" stroke="#2c4940"/>
<text class="label green" x="292" y="178">Target 1</text>
<rect class="box" x="306" y="198" width="174" height="60" rx="7"/>
<text x="393" y="224" text-anchor="middle">Delay buffer</text><text class="muted" x="393" y="248" text-anchor="middle">0–2047 samples</text>
<path class="path" d="M238 228 H306" marker-end="url(#arrow)"/>
<circle cx="238" cy="228" r="4" fill="#37c964"/>
<rect class="box" x="518" y="162" width="210" height="42" rx="7"/>
<text x="623" y="190" text-anchor="middle">32-bit NCO + gain</text>
<path class="control" d="M728 183 H849 V198"/>
<path class="path" d="M480 228 H752" marker-end="url(#arrow)"/>
<text class="coefficient" x="610" y="255" text-anchor="middle">Delayed IQ</text>
<rect x="752" y="198" width="194" height="60" rx="7" fill="#183b29" stroke="#37c964"/>
<text x="849" y="225" text-anchor="middle">Complex multiply</text><text class="muted" x="849" y="248" text-anchor="middle">Phase shift and gain</text>
<path class="path" d="M946 228 H1045"/><circle cx="1045" cy="228" r="4" fill="#37c964"/>
</g>
<g aria-label="Target 2">
<rect x="272" y="300" width="740" height="128" rx="10" fill="#142021" stroke="#2c4940"/>
<text class="label green" x="292" y="328">Target 2</text>
<rect class="box" x="306" y="348" width="174" height="60" rx="7"/>
<text x="393" y="374" text-anchor="middle">Delay buffer</text><text class="muted" x="393" y="398" text-anchor="middle">0–2047 samples</text>
<path class="path" d="M238 378 H306" marker-end="url(#arrow)"/>
<circle cx="238" cy="378" r="4" fill="#37c964"/>
<rect class="box" x="518" y="312" width="210" height="42" rx="7"/>
<text x="623" y="340" text-anchor="middle">32-bit NCO + gain</text>
<path class="control" d="M728 333 H849 V348"/>
<path class="path" d="M480 378 H752" marker-end="url(#arrow)"/>
<text class="coefficient" x="610" y="405" text-anchor="middle">Delayed IQ</text>
<rect x="752" y="348" width="194" height="60" rx="7" fill="#183b29" stroke="#37c964"/>
<text x="849" y="375" text-anchor="middle">Complex multiply</text><text class="muted" x="849" y="398" text-anchor="middle">Phase shift and gain</text>
<path class="path" d="M946 378 H1045"/><circle cx="1045" cy="378" r="4" fill="#37c964"/>
</g>
<g aria-label="Target 3">
<rect x="272" y="450" width="740" height="128" rx="10" fill="#142021" stroke="#2c4940"/>
<text class="label green" x="292" y="478">Target 3</text>
<rect class="box" x="306" y="498" width="174" height="60" rx="7"/>
<text x="393" y="524" text-anchor="middle">Delay buffer</text><text class="muted" x="393" y="548" text-anchor="middle">0–2047 samples</text>
<path class="path" d="M238 528 H306" marker-end="url(#arrow)"/>
<circle cx="238" cy="528" r="4" fill="#37c964"/>
<rect class="box" x="518" y="462" width="210" height="42" rx="7"/>
<text x="623" y="490" text-anchor="middle">32-bit NCO + gain</text>
<path class="control" d="M728 483 H849 V498"/>
<path class="path" d="M480 528 H752" marker-end="url(#arrow)"/>
<text class="coefficient" x="610" y="555" text-anchor="middle">Delayed IQ</text>
<rect x="752" y="498" width="194" height="60" rx="7" fill="#183b29" stroke="#37c964"/>
<text x="849" y="525" text-anchor="middle">Complex multiply</text><text class="muted" x="849" y="548" text-anchor="middle">Phase shift and gain</text>
<path class="path" d="M946 528 H1045"/><circle cx="1045" cy="528" r="4" fill="#37c964"/>
</g>
<g aria-label="Target 4">
<rect x="272" y="600" width="740" height="128" rx="10" fill="#142021" stroke="#2c4940"/>
<text class="label green" x="292" y="628">Target 4</text>
<rect class="box" x="306" y="648" width="174" height="60" rx="7"/>
<text x="393" y="674" text-anchor="middle">Delay buffer</text><text class="muted" x="393" y="698" text-anchor="middle">0–2047 samples</text>
<path class="path" d="M238 678 H306" marker-end="url(#arrow)"/>
<circle cx="238" cy="678" r="4" fill="#37c964"/>
<rect class="box" x="518" y="612" width="210" height="42" rx="7"/>
<text x="623" y="640" text-anchor="middle">32-bit NCO + gain</text>
<path class="control" d="M728 633 H849 V648"/>
<path class="path" d="M480 678 H752" marker-end="url(#arrow)"/>
<text class="coefficient" x="610" y="705" text-anchor="middle">Delayed IQ</text>
<rect x="752" y="648" width="194" height="60" rx="7" fill="#183b29" stroke="#37c964"/>
<text x="849" y="675" text-anchor="middle">Complex multiply</text><text class="muted" x="849" y="698" text-anchor="middle">Phase shift and gain</text>
<path class="path" d="M946 678 H1045"/><circle cx="1045" cy="678" r="4" fill="#37c964"/>
</g>
<path d="M36 765 H1404" stroke="#394348"/>
<text x="40" y="800">y[n] = Σ gₖ · x[n − dₖ] · exp(jφₖ[n])</text>
<text class="muted" x="1400" y="800" text-anchor="end">Pipeline registers are omitted for clarity.</text>
<text class="muted" x="40" y="830">All four paths share the same sample clock.</text>
</svg>
