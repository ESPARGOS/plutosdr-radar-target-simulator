<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title description">
  <title id="title">Four FPGA target paths</title>
  <desc id="description">The received signal feeds four parallel delay buffers. Each delayed signal is multiplied by a rotating complex value that sets its Doppler shift and gain. The four echoes are summed and sent to the transmitter.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10Z" fill="#a1adb2"/>
    </marker>
  </defs>
  <style>
    text { font-family: Carlito, "Segoe UI", Arial, sans-serif; fill: #dee2e6; font-size: 24px; }
    .target { fill: #37c964; font-weight: 600; }
    .box { fill: #182126; stroke: #394348; stroke-width: 1.5; }
    .wire { fill: none; stroke: #a1adb2; stroke-width: 2; }
    .coefficient { fill: none; stroke: #37c964; stroke-width: 2; }
  </style>
  <rect width="1200" height="580" rx="16" fill="#11191e"/>
  <rect class="box" x="24" y="275" width="130" height="60" rx="8"/>
  <text x="89" y="313" text-anchor="middle">Receive</text>
  <path class="wire" d="M154 305 H190 M190 95 V515"/>
  <path class="wire" d="M920 95 V515 M920 305 H970" marker-end="url(#arrow)"/>
  <circle class="box" cx="1000" cy="305" r="30"/>
  <text x="1000" y="315" text-anchor="middle" style="font-size:32px">Σ</text>
  <path class="wire" d="M1030 305 H1060" marker-end="url(#arrow)"/>
  <rect class="box" x="1060" y="275" width="116" height="60" rx="8"/>
  <text x="1118" y="313" text-anchor="middle">Transmit</text>
  <g aria-label="Target 1" transform="translate(0 0)">
    <rect x="215" y="20" width="675" height="110" rx="10" fill="#142021" stroke="#2c4940"/>
    <text class="target" x="235" y="50">Target 1</text>
    <path class="wire" d="M190 95 H275" marker-end="url(#arrow)"/>
    <circle cx="190" cy="95" r="4" fill="#37c964"/>
    <rect class="box" x="275" y="70" width="170" height="50" rx="7"/>
    <text x="360" y="103" text-anchor="middle">Delay</text>
    <path class="wire" d="M445 95 H778" marker-end="url(#arrow)"/>
    <rect class="box" x="515" y="30" width="190" height="45" rx="7"/>
    <text x="610" y="61" text-anchor="middle">Doppler + gain</text>
    <path class="coefficient" d="M705 52 H800 V74" marker-end="url(#arrow)"/>
    <circle cx="800" cy="95" r="21" fill="#183b29" stroke="#37c964"/>
    <text x="800" y="104" text-anchor="middle" style="font-size:32px">×</text>
    <path class="wire" d="M821 95 H920"/>
    <circle cx="920" cy="95" r="4" fill="#37c964"/>
  </g>
  <g aria-label="Target 2" transform="translate(0 140)">
    <rect x="215" y="20" width="675" height="110" rx="10" fill="#142021" stroke="#2c4940"/>
    <text class="target" x="235" y="50">Target 2</text>
    <path class="wire" d="M190 95 H275" marker-end="url(#arrow)"/>
    <circle cx="190" cy="95" r="4" fill="#37c964"/>
    <rect class="box" x="275" y="70" width="170" height="50" rx="7"/>
    <text x="360" y="103" text-anchor="middle">Delay</text>
    <path class="wire" d="M445 95 H778" marker-end="url(#arrow)"/>
    <rect class="box" x="515" y="30" width="190" height="45" rx="7"/>
    <text x="610" y="61" text-anchor="middle">Doppler + gain</text>
    <path class="coefficient" d="M705 52 H800 V74" marker-end="url(#arrow)"/>
    <circle cx="800" cy="95" r="21" fill="#183b29" stroke="#37c964"/>
    <text x="800" y="104" text-anchor="middle" style="font-size:32px">×</text>
    <path class="wire" d="M821 95 H920"/>
    <circle cx="920" cy="95" r="4" fill="#37c964"/>
  </g>
  <g aria-label="Target 3" transform="translate(0 280)">
    <rect x="215" y="20" width="675" height="110" rx="10" fill="#142021" stroke="#2c4940"/>
    <text class="target" x="235" y="50">Target 3</text>
    <path class="wire" d="M190 95 H275" marker-end="url(#arrow)"/>
    <circle cx="190" cy="95" r="4" fill="#37c964"/>
    <rect class="box" x="275" y="70" width="170" height="50" rx="7"/>
    <text x="360" y="103" text-anchor="middle">Delay</text>
    <path class="wire" d="M445 95 H778" marker-end="url(#arrow)"/>
    <rect class="box" x="515" y="30" width="190" height="45" rx="7"/>
    <text x="610" y="61" text-anchor="middle">Doppler + gain</text>
    <path class="coefficient" d="M705 52 H800 V74" marker-end="url(#arrow)"/>
    <circle cx="800" cy="95" r="21" fill="#183b29" stroke="#37c964"/>
    <text x="800" y="104" text-anchor="middle" style="font-size:32px">×</text>
    <path class="wire" d="M821 95 H920"/>
    <circle cx="920" cy="95" r="4" fill="#37c964"/>
  </g>
  <g aria-label="Target 4" transform="translate(0 420)">
    <rect x="215" y="20" width="675" height="110" rx="10" fill="#142021" stroke="#2c4940"/>
    <text class="target" x="235" y="50">Target 4</text>
    <path class="wire" d="M190 95 H275" marker-end="url(#arrow)"/>
    <circle cx="190" cy="95" r="4" fill="#37c964"/>
    <rect class="box" x="275" y="70" width="170" height="50" rx="7"/>
    <text x="360" y="103" text-anchor="middle">Delay</text>
    <path class="wire" d="M445 95 H778" marker-end="url(#arrow)"/>
    <rect class="box" x="515" y="30" width="190" height="45" rx="7"/>
    <text x="610" y="61" text-anchor="middle">Doppler + gain</text>
    <path class="coefficient" d="M705 52 H800 V74" marker-end="url(#arrow)"/>
    <circle cx="800" cy="95" r="21" fill="#183b29" stroke="#37c964"/>
    <text x="800" y="104" text-anchor="middle" style="font-size:32px">×</text>
    <path class="wire" d="M821 95 H920"/>
    <circle cx="920" cy="95" r="4" fill="#37c964"/>
  </g>
</svg>
