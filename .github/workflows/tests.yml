name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RTS_SCRATCH_DIR: ${{ github.workspace }}/build/scratch
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y iverilog
      - run: python -m pip install -r requirements-test.txt
      - run: make test-local test-analysis
      - run: python -m compileall -q host scripts tests
      - run: for f in scripts/*.sh tests/run.sh; do bash -n "$f"; done
      - name: Preview UI (no hardware)
        run: make test-web
        env:
          CHROMIUM_BIN: /usr/bin/google-chrome
